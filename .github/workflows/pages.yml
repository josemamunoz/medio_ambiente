name: Actualizar datos y publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 3 * *"   # día 3 de cada mes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Datos de la huella (factores + demo)
        run: python -m pipeline.build
      - name: Observatorio RETC (descarga desde datos.gob.cl)
        # Si el portal del Estado falla, el sitio se publica igual sin esta sección.
        continue-on-error: true
        run: python -m pipeline.observatorio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
